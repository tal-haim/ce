{{- if .Values.kafka.enabled }}
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Values.kafka.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: cluster
    {{- include "mlrun-ce.common.labels" . | nindent 4 }}
  annotations:
    # Fire only on first install - Kafka is stateful (the KRaft cluster ID lives on the
    # persistent-claim PVC, which Strimzi does not delete with the CR). A post-upgrade
    # hook would delete+recreate this CR on every upgrade (Helm hooks are create-only;
    # the default hook-delete-policy is before-hook-creation), minting a new cluster ID
    # against the surviving PVC and crash-looping the broker.
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
spec:
  kafka:
    listeners:
    {{- range .Values.kafka.listeners }}
      - name: {{ .name }}
        port: {{ .port }}
        type: {{ .type }}
        tls: {{ .tls }}
        {{- if .configuration }}
        configuration:
          {{- toYaml .configuration | nindent 10 }}
        {{- end }}
    {{- end }}
    config:
      {{- toYaml .Values.kafka.config | nindent 6 }}
  {{- if gt (.Values.kafka.zookeeper.replicas | int) 0 }}
  zookeeper:
    replicas: {{ .Values.kafka.zookeeper.replicas }}
    storage:
      type: persistent-claim
      size: 8Gi
  {{- end }}
{{- end }}
