{{- if .Values.kafka.enabled }}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: {{ .Values.kafka.name }}-pool
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: nodepool
    strimzi.io/cluster: {{ .Values.kafka.name }}
    {{- include "mlrun-ce.common.labels" . | nindent 4 }}
  annotations:
    # Fire only on first install - Kafka is stateful (the KRaft cluster ID lives on the
    # persistent-claim PVC, which Strimzi does not delete with the CR). A post-upgrade
    # hook would delete+recreate this CR on every upgrade (Helm hooks are create-only;
    # the default hook-delete-policy is before-hook-creation), minting a new cluster ID
    # against the surviving PVC and crash-looping the broker.
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: {{ .Values.kafka.storage.type }}
    size: {{ .Values.kafka.storage.size }}
    {{- if .Values.kafka.storage.class }}
    class: {{ .Values.kafka.storage.class }}
    {{- end }}
  resources:
    requests:
      memory: {{ .Values.kafka.resources.requests.memory }}
      cpu: {{ .Values.kafka.resources.requests.cpu }}
    limits:
      memory: {{ .Values.kafka.resources.limits.memory }}
      cpu: {{ .Values.kafka.resources.limits.cpu }}
{{- end }}
